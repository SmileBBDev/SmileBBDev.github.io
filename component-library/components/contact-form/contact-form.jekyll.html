<!-- begin contact -->
{% assign c = "c-contact-form" %}
<div class="{{c}}" id="contact">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="{{c}}__form-box">
          <div class="{{c}}__contact-head">
            <h2 class="{{c}}__contact-title">{{ include.form_title }}</h2>
            <div class="{{c}}__contact-description">
              <span id="contentText"></span>
            </div>
          </div>
        </div>

        <div class="{{c}}__form-group {{c}}__form-group--button">
          <a href="//{{ site.data.newsletter.newsletter_identifier}}" class="c-button c-button--primary c-button--large">
            메일로 문의
          </a>
          <a href="/Contact" class="c-button c-button--primary c-button--large">
            구글 폼으로 문의
          </a>
          <a href="https://github.com/SmileBBDev" class="c-button c-button--primary c-button--large">
            GitHub
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- end contact -->


<script>
  var content_text = ['{{ include.form_description }}'];
</script>
