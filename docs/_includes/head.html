<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.url == "/" %}{{ site.data.general_settings.title }}{% elsif page.title %}{{ page.title }}{% else
    %}{{ site.data.general_settings.title }}{% endif %}</title>
  <meta name='description'
    content='{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.data.general_settings.description }}{% endif %}'>

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.url == " /" %}{{ site.data.general_settings.title }}{% else %}{{
    page.title }} – {{ site.data.general_settings.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.url == " /" %}{{ site.data.general_settings.description |
    strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{
    page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta name="twitter:image:src" content="{% if page.url == " /" %}{{
    site.data.general_settings.social_media_share_image | absolute_url }}{% else %}{{ page.image | absolute_url }}{%
    endif %}">

  <!-- Facebook OpenGraph -->
  <meta property="og:title" content="{% if page.url == " /" %}{{ site.data.general_settings.title }}{% else %}{{
    page.title }} – {{ site.data.general_settings.title }}{% endif %}">
  <meta property="og:description" content="{% if page.url == " /" %}{{ site.data.general_settings.description |
    strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{
    page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta property="og:image" content="{% if page.url == " /" %}{{ site.data.general_settings.social_media_share_image |
    absolute_url }}{% else %}{{ page.image | absolute_url }}{% endif %}">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Ionicons v5 -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!--  수학 수식 처리 라이브러리 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],  // 인라인 수식 허용 - 본문안에 깔끔하게 작성
        displayMath: [['$$', '$$'], ['\\[', '\\]']]  // 블록 수식 - 크게 중앙 정렬
      }
    };
  </script>
  <!-- MathJax 라이브러리 -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>


  <!-- <link rel="stylesheet" href="/assets/main.css"> -->
  <link rel="stylesheet" href="{{ '/assets/css/bookshop.css' | relative_url }}">
  <link rel="stylesheet" href="/assets/css/category-bar.css">
  <!-- css -->
</head>
